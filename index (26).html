<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-VAVE FM-1 Emulator - Trumpagotchi</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d11;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #16161f;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #232330;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }
        .title-group h1 {
            margin: 0;
            font-size: 1.15rem;
            color: #ffb703;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .title-group p {
            margin: 2px 0 0 0;
            font-size: 0.8rem;
            color: #8e8e9f;
        }
        .status-pill {
            background-color: #ffb703;
            color: #0d0d11;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .emulator-container {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .frame-wrapper {
            width: 100%;
            max-width: 960px;
            height: 100%;
            max-height: 700px;
            background-color: #000000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #232330;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>Trumpagotchi Virtual Pet</h1>
            <p>M-VAVE FM-1 Browser Emulation Engine</p>
        </div>
        <div class="status-pill">System Online</div>
    </header>

    <div class="emulator-container">
        <div class="frame-wrapper">
            <iframe src="https://joakimeriksson.github.io/fm1-emu/?embed=1&fw=https://raw.githubusercontent.com/adamcharleswilsonmusic-code/Trumpagotchi/main/releases/trumpagotchi.fwsc"></iframe>
        </div>
    </div>

</body>
</html>
