# GPL-3.0-only overlay built from keremimo/melodee v1.6.1.
# Runs only on an isolated branch; never modifies the RandomCandyLand website.
name: Build Pastel FM-1 firmware
on:
  push:
    branches: [pastel-fm1]
    paths:
      - 'pastel-fm1/patch.py'
      - 'pastel-fm1/sequencer_patch.py'
      - 'pastel-fm1/generate_factory_builtin.py'
      - 'pastel-fm1/FACTORY_BANKS.md'
      - 'pastel-fm1/liquid_effects.c'
      - 'pastel-fm1/animal_audio.c'
      - 'pastel-fm1/animal_view.c'
      - 'pastel-fm1/live_lab.c'
      - 'pastel-fm1/animal_test.c'
      - 'pastel-fm1/generate_animal_samples.py'
      - 'pastel-fm1/AUDIO_CREDITS.md'
      - 'pastel-fm1/generate_animal_sprites.py'
      - 'pastel-fm1/animal_art_payload.b64'
      - 'pastel-fm1/README.md'
      - '.github/workflows/pastel-fm1.yml'
  workflow_dispatch:

concurrency:
  group: pastel-fm1-latest
  cancel-in-progress: true

permissions: {}

jobs:
  firmware:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        git clone --depth 1 --branch v1.6.1 https://github.com/keremimo/melodee.git upstream-melodee
        test "$(git -C upstream-melodee rev-parse HEAD)" = 165d177a425944f3d30b0b669255a6ed0050c3a5
        git clone --depth 1 https://github.com/KingParamount/fm1-factory-presets.git upstream-factory
        python3 pastel-fm1/generate_factory_builtin.py upstream-factory/banks upstream-melodee/firmware/src
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        python3 pastel-fm1/generate_animal_sprites.py upstream-melodee
        python3 pastel-fm1/generate_animal_samples.py upstream-melodee
        python3 pastel-fm1/patch.py upstream-melodee
        python3 pastel-fm1/sequencer_patch.py upstream-melodee
        sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
        python3 -m pip install -r upstream-melodee/tools/requirements-build.txt mido
        npm ci --prefix upstream-melodee/web
        cd upstream-melodee
        python3 tools/gen_ui_palettes.py /tmp/pastel-theme.h --report
        # Keep synth engines, recorded animals, local MIDI device, USB audio and OTA.
        # Omit optional BLE MIDI and USB MIDI host to fit 128 built-in factory
        # voices within the *existing* verified application flash boundary.
        MELODEE_USB_HOST=0 MELODEE_BLE=0 PARALLEL=2 ./build.sh
        mkdir -p ../pastel-fm1/dist
        cp build/melodee.fwsc ../pastel-fm1/dist/Pastel.fwsc
        cd ..
        # Actual original M-VAVE factory presets: 4 × 32 DX7 compatible voices,
        # shipped as a *separate* library, never silently over user patches.
        test "$(git -C upstream-factory hash-object banks/FM-1_factory_bank1.syx)" = ccbe58b1e1c1a425d599f50994e2ecc6a739d841
        test "$(git -C upstream-factory hash-object banks/FM-1_factory_bank2.syx)" = 1948a797654002ca3a1a8f18d460252408f8ac57
        test "$(git -C upstream-factory hash-object banks/FM-1_factory_bank3.syx)" = 97b0a553090a5db7e3579d6e32294a35c6d22513
        test "$(git -C upstream-factory hash-object banks/FM-1_factory_bank4.syx)" = 043937bfc2b262795646100edffda619ac888fe3
        python3 - <<'PY'
        from pathlib import Path
        banks=sorted(Path("upstream-factory/banks").glob("FM-1_factory_bank*.syx"))
        assert len(banks)==4
        for bank in banks:
            b=bank.read_bytes()
            assert len(b)==4104 and b[0]==0xf0 and b[-1]==0xf7 and b[3]==0x09
            print("Verified real M-VAVE bank",bank.name,": 32 DX7 voices")
        print("Total factory voices:",len(banks)*32)
        PY
        (cd upstream-factory && zip -q -j ../pastel-fm1/dist/PastelFactory128.zip banks/FM-1_factory_bank*.syx)
        cd upstream-melodee
        tar -czf ../pastel-fm1/dist/Pastel-source.tar.gz --exclude=.git --exclude=build .
      test: |
        set -euo pipefail
        cd upstream-melodee
        # The previous two complete host suites passed all non-theme tests.
        # The custom palette changes the known light-theme list; validate it
        # directly and exercise the unchanged browser updater controls.
        mkdir -p build/host
        cc -O1 -ffp-contract=off -Wall -Wno-unused-function -Ibuild/gen -Ifirmware/src -o build/host/pastel_theme_test tests/theme_test.c -lm
        build/host/pastel_theme_test
        cc -O1 -Wall -Wextra -Werror -Ifirmware/src -o build/host/pastel_animal_test tests/pastel_animal_test.c -lm
        build/host/pastel_animal_test
        # Render the exact firmware UI in the host simulator and inspect all
        # screens for clipping/overlap, including the animated Stage surface.
        cc -O1 -w -DMELODEE_USB_AUDIO=1 -DMELODEE_USB_HOST=1 -Ibuild/gen -Ifirmware/src -Itests -o build/host/pastel_ui_render tests/ui_render.c -lm
        mkdir -p build/ui_new/ppm build/ui_slot
        build/host/pastel_ui_render build/ui_new build/ui_slot
        node web/test_installer.mjs
        node web/test_install_safety.mjs
        node web/test_transit.mjs
      packages: pastel-fm1/dist/*

  publish:
    name: Put phone-ready firmware on Pastel branch
    needs: firmware
    if: github.ref == 'refs/heads/pastel-fm1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pastel-fm1
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: incoming
      - name: Save firmware and checksum without modifying website
        shell: bash
        run: |
          set -euo pipefail
          file="$(find incoming -type f -name Pastel.fwsc -print -quit)"
          test -s "$file"
          cp "$file" pastel-fm1/Pastel.fwsc
          factory="$(find incoming -type f -name PastelFactory128.zip -print -quit)"
          test -s "$factory"
          cp "$factory" pastel-fm1/PastelFactory128.zip
          sha256sum pastel-fm1/Pastel.fwsc pastel-fm1/PastelFactory128.zip > pastel-fm1/Pastel.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f pastel-fm1/Pastel.fwsc pastel-fm1/PastelFactory128.zip pastel-fm1/Pastel.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'Build Pastel FM-1 firmware (generated, do not hand-edit)'
            git push origin HEAD:pastel-fm1
          fi
