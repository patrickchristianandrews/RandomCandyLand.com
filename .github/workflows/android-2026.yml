name: Android Holiday Deals 2026
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/holiday-deals-2026/**'
      - '.github/workflows/android-2026.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install API 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android debug APK and unsigned release AAB
        working-directory: android/holiday-deals-2026
        run: gradle --no-daemon --stacktrace assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Holiday-Deal-Madness-2026-Android
          path: |
            android/holiday-deals-2026/app/build/outputs/apk/debug/*.apk
            android/holiday-deals-2026/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
