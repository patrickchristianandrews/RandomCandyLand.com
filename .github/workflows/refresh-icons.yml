name: Refresh Candy Land site icons
on:
  push:
    branches: [main]
    paths:
      - 'public/icon.svg'
      - '.github/workflows/refresh-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG rendering dependency
        run: python -m pip install 'CairoSVG>=2.7,<3'
      - name: Render favicon and phone icons from brand illustration
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          for filename, size in (
              ('favicon.png', 64),
              ('apple-touch-icon.png', 180),
              ('icon-192.png', 192),
              ('icon-512.png', 512),
          ):
              cairosvg.svg2png(
                  url='public/icon.svg',
                  write_to=str(Path('public') / filename),
                  output_width=size,
                  output_height=size,
              )
          PY
      - name: Commit refreshed brand assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.png public/apple-touch-icon.png public/icon-192.png public/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Sync phone and browser icons with Candy Land mascot"
            git push
          fi
