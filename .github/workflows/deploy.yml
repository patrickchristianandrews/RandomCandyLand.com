name: Deploy fresh RandomCandyLand to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Latest website release wins. Do not let two custom builds deploy out of order.
concurrency:
  group: sugarverse-production-recovery-20261101
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up isolated Python for reliable icon rendering
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild full-bleed candy artwork for phone and circular app icons
        run: |
          python -m pip install --quiet "Pillow>=10,<13"
          python scripts/render-candy-app-icons.py

      - name: Check the original Candy Land artwork and app icons
        shell: bash
        run: |
          test -s public/random-candy-land-art.webp
          test -s public/icon.svg
          for image in favicon.png apple-touch-icon.png icon-192.png icon-512.png; do
            test -s "public/$image" || { echo "::error::Missing Candy Land app icon: $image"; exit 1; }
          done

      - name: Validate Candy Studio JavaScript and free-worker syntax
        run: |
          node --check public/studio/studio.js
          node --check public/studio/free-config.js
          node --check studio-free-ai/worker.js
          node --check public/sw.js
          node --check public/notifications/center.js
          node --check public/notifications/push-config.js
          node --check game-notifications/worker.js
          node --check game-notifications/generate-vapid.mjs
          node scripts/test-game-push.mjs

      - name: Verify Random AI saved models survive new visits and cache changes
        run: node scripts/test-random-ai-model-memory.mjs

      - name: Verify specialist Random AI workflow catalog and chat navigation
        run: node scripts/test-random-ai-library.mjs

      - name: Verify Unwrapped toy library and personalized report privacy
        run: node scripts/test-unwrapped-toys.mjs
      - name: Verify all Unwrapped report types and downloadable sample PDFs
        run: node scripts/test-unwrapped-report-coverage.mjs

      - name: Check two fictional adults completed all 69 plus 32 genuine questionnaire answers
        run: node scripts/test-unwrapped-fictional-respondents.mjs

      - name: Build the entire website
        run: bun run build

      - name: Generate two complete fictional 101-answer Unwrapped reports from the actual browser engine
        run: node scripts/generate-unwrapped-demo-reports.mjs

      - name: Validate After Dark scripts and all published pages
        run: node scripts/check-public-pages.mjs

      - name: Test casino room creation, missing-host recovery and concurrent joiners
        run: node scripts/test-casino-network.mjs

      - name: Test Cloudflare WebSocket room relay protocol
        run: node scripts/test-casino-relay.mjs

      - name: Probe live Cloudflare multiplayer room (verification, not required for fallback site)
        continue-on-error: true
        run: node scripts/check-casino-relay-live.mjs

      - name: Test After Dark and Trumpagotchi in a real Chrome browser
        shell: bash
        run: |
          # A shared runner can occasionally fail to launch Chrome at all.
          # Never waive a genuine website test failure, only Chrome startup failure.
          for attempt in 1 2 3; do
            echo "Browser interaction test attempt $attempt / 3"
            report=$(mktemp)
            if node scripts/smoke-after-dark.mjs >"$report" 2>&1; then
              cat "$report"
              rm -f "$report"
              exit 0
            fi
            cat "$report"
            if grep -Fq 'Chrome did not open DevTools port' "$report" &&
               ! grep -Eq 'After Dark regression|Clue Compass.*failed|Trumpagotchi poll button missing|POLL did not trigger|Browser runtime errors|Browser JavaScript error' "$report"; then
              echo "::warning::Chrome startup failed on this runner; retrying."
              rm -f "$report"
              sleep 4
            else
              echo "::error::The browser detected a real interaction failure."
              rm -f "$report"
              exit 1
            fi
          done
          echo "::warning::Headless Chrome was unavailable on this runner. Static release tests passed; browser interactions could not be verified here."

      - name: Identify this exact release in the published files
        run: printf '%s\n' "$GITHUB_SHA" > dist/release-id.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Save the new website for publishing
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      # A second, legacy GitHub Pages job is publishing the stale checked-in
      # HTML from the main branch. Wait BEFORE acquiring the deployment
      # environment so the legacy job cannot overwrite the new build afterward.
      - name: Wait for older automatic Pages publishers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for legacy branch-source Pages jobs to finish."
          sleep 12
          for attempt in {1..45}; do
            payload=$(curl --fail --silent --show-error --retry 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50") || {
                echo "::warning::Could not read Pages queue; continuing."
                break
              }
            count=$(printf '%s' "$payload" | jq '[.workflow_runs[] | select((.name == "pages build and deployment" or .name == "Deploy to GitHub Pages") and .status != "completed")] | length')
            if [[ "$count" == "0" ]]; then
              echo "The legacy Pages queue is clear; the new website can publish last."
              break
            fi
            echo "${count} legacy Pages run(s) still queued or running; retry ${attempt}/45"
            sleep 6
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Inspect GitHub Pages publishing source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! config=$(curl --fail --silent --show-error --retry 2 --max-time 20 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"); then
            echo "::warning::Could not read Pages settings; continuing to try deployment."
            exit 0
          fi
          build_type=$(echo "$config" | jq -r '.build_type // "unknown"')
          cname=$(echo "$config" | jq -r '.cname // "(not set)"')
          echo "Pages source: $build_type"
          echo "Custom domain: $cname"
          if [[ "$build_type" == "legacy" ]]; then
            echo "::error::GitHub Pages is still configured to deploy from a branch. Switch Settings > Pages > Build and deployment > Source to GitHub Actions."
            exit 1
          fi
      - name: Publish newest site over the old version
        id: deployment
        uses: actions/deploy-pages@v4

      # GitHub Pages requires Settings > Pages > Build and deployment > GitHub Actions.
      # A CNAME file alone does not set the Pages custom domain in repository settings.
      - name: Verify published Pages site (informational while domain DNS is configured)
        shell: bash
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          if [[ -z "$base" ]]; then
            echo "::warning::No Pages URL was returned. Verify GitHub Pages source and custom domain in repository Settings."
            exit 1
          fi
          echo "GitHub Pages deployment URL: $base"
          echo "Checking for built artifact release $EXPECTED_RELEASE"
          for attempt in 1 2 3 4 5 6; do
            current=$(curl --fail --silent --show-error --location --max-time 12 \
              -H "Cache-Control: no-cache" \
              "$base/release-id.txt?release=$EXPECTED_RELEASE&attempt=$attempt" || true)
            if [[ "$current" == "$EXPECTED_RELEASE" ]]; then
              for route in moodropolis the-corridors the-docket; do
                page=$(curl --fail --silent --show-error --location --max-time 12 \
                  -H "Cache-Control: no-cache" "$base/$route/?release=$EXPECTED_RELEASE" || true)
                if [[ "$page" != *"<title>"* ]]; then
                  echo "::warning::$route is not readable on the published Pages URL yet."
                  exit 1
                fi
              done
              echo "::notice::GitHub Pages serves this exact release and the independent interactive games."
              exit 0
            fi
            echo "Pages publication is still propagating (check $attempt/6)."
            sleep 5
          done
          echo "::warning::Pages deployment was accepted, but the returned site URL has not caught up."
          echo "::warning::Check GitHub Pages source, custom domain and DNS before switching away from any working host."
          exit 1
