name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build

      - name: Stamp this exact release for live verification
        run: printf '%s\n' "$GITHUB_SHA" > dist/release-id.txt

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # GitHub Pages also has a branch-source publisher enabled. That publisher
      # serves stale checked-in files and used to overwrite the actual build.
      # Wait for it to finish, then deploy the newly built dist artifact last.
      - name: Wait for automatic branch Pages publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Waiting for the duplicate branch Pages job before publishing the real build"
          sleep 15
          for attempt in {1..30}; do
            response=$(curl --fail --silent --show-error --retry 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30") || {
                echo "Cannot inspect parallel Pages job; continuing with the built site"
                break
              }
            statuses=$(printf '%s' "$response" | jq -r '[.workflow_runs[] | select(.name == "pages build and deployment") | .status] | join(",")')
            if [[ -z "$statuses" ]]; then
              echo "No branch Pages job present; publishing the built site"
              break
            fi
            if [[ "$statuses" != *"queued"* && "$statuses" != *"in_progress"* && "$statuses" != *"waiting"* && "$statuses" != *"requested"* && "$statuses" != *"pending"* ]]; then
              echo "Branch Pages deployment is complete: $statuses"
              break
            fi
            echo "Branch Pages is $statuses; waiting to avoid a stale publish"
            sleep 5
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production really serves the latest release
        continue-on-error: true
        shell: bash
        run: |
          echo "Checking https://randomcandyland.com/release-id.txt"
          for attempt in {1..18}; do
            current=$(curl --fail --silent --show-error --location --max-time 15 \
              -H "Cache-Control: no-cache" \
              "https://randomcandyland.com/release-id.txt?attempt=${attempt}" || true)
            if [[ "$current" == "$GITHUB_SHA" ]]; then
              echo "::notice::Verified LIVE release $GITHUB_SHA at randomcandyland.com"
              exit 0
            fi
            echo "Release not visible yet (attempt $attempt); retrying"
            sleep 5
          done
          echo "::warning::GitHub Pages deployed, but the custom domain did not return this release"
          exit 1
