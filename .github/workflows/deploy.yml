name: Deploy fresh RandomCandyLand to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Latest website release wins. Do not let two custom builds deploy out of order.
concurrency:
  group: sugarverse-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build the entire website
        run: bun run build

      - name: Identify this exact release in the published files
        run: printf '%s\n' "$GITHUB_SHA" > dist/release-id.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Save the new website for publishing
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # A second, legacy GitHub Pages job is publishing the stale checked-in
      # HTML from the main branch. Wait BEFORE acquiring the deployment
      # environment so the legacy job cannot overwrite the new build afterward.
      - name: Wait for older automatic Pages publishers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for legacy branch-source Pages jobs to finish."
          sleep 12
          for attempt in {1..45}; do
            payload=$(curl --fail --silent --show-error --retry 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=50") || {
                echo "::warning::Could not read Pages queue; continuing."
                break
              }
            count=$(printf '%s' "$payload" | jq '[.workflow_runs[] | select((.name == "pages build and deployment" or .name == "Deploy to GitHub Pages") and .status != "completed")] | length')
            if [[ "$count" == "0" ]]; then
              echo "The legacy Pages queue is clear; the new website can publish last."
              break
            fi
            echo "${count} legacy Pages run(s) still queued or running; retry ${attempt}/45"
            sleep 6
          done

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish newest site over the old version
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check live RandomCandyLand matches this commit
        continue-on-error: true
        shell: bash
        run: |
          for attempt in {1..20}; do
            current=$(curl --fail --silent --show-error --location --max-time 15 \
              -H "Cache-Control: no-cache" \
              "https://randomcandyland.com/release-id.txt?rev=${GITHUB_SHA}&attempt=${attempt}" || true)
            if [[ "$current" == "$GITHUB_SHA" ]]; then
              echo "::notice::LIVE WEBSITE VERIFIED: ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting for the new release to appear at the domain."
            sleep 6
          done
          echo "::warning::Pages accepted deployment, but the live domain could not yet be verified."
          exit 1
