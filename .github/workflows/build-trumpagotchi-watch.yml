name: Build Trumpagotchi Pixel Watch APK

on:
  push:
    branches: [main]
    paths:
      - 'wear-os/trumpagotchi/**'
      - '.github/workflows/build-trumpagotchi-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: wear-os/trumpagotchi
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK and install platform 35
        run: |
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$manager" || { echo "Android sdkmanager was not installed on this runner"; exit 1; }
          "$manager" --version
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build standalone Wear OS APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Validate the APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trumpagotchi-PixelWatch-APK
          path: wear-os/trumpagotchi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
